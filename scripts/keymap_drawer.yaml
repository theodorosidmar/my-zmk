# Config for https://github.com/caksoylar/keymap-drawer, used by ./draw.sh
draw_config:
  key_h: 60
  append_colon_to_layer_header: false
  footer_text: Generated from config/corne.keymap with keymap-drawer (scripts/draw.sh)
parse_config:
  trans_legend: {t: ▽, type: trans}
  raw_binding_map:
    '&kp LS(LGUI)': Sft+Gui
    '&kp RA(COMMA)': ç
    '&bootloader': {t: Boot, type: danger}
    '&kp K_VOLUME_DOWN': Vol-
    '&kp K_VOLUME_UP': Vol+
    '&kp C_PREV': ⏮ Prev
    '&kp C_PP': ⏯ Play
    '&kp C_NEXT': ⏭ Next
    '&kp PSCRN': PrtSc
    '&mkp LCLK': LClick
    '&mkp RCLK': RClick
    '&mmv MOVE_LEFT': ←
    '&mmv MOVE_DOWN': ↓
    '&mmv MOVE_UP': ↑
    '&mmv MOVE_RIGHT': →
    '&msc SCRL_UP': Scroll ↑
    '&msc SCRL_DOWN': Scroll ↓
    '&msc SCRL_LEFT': Scroll ←
    '&msc SCRL_RIGHT': Scroll →
    '&kp LEFT': ←
    '&kp RIGHT': →
    '&kp UP': ↑
    '&kp DOWN': ↓
    '&kp PG_UP': PgUp
    '&kp PG_DN': PgDn
    '&kp HOME': Home
    '&kp END': End
    '&kp KP_DIVIDE': /
    '&kp KP_PLUS': +
    '&kp KP_MINUS': '-'
    '&kp KP_EQUAL': '='
    '&kp ENTER': Enter
    '&kp SPACE': Space
    '&kp CAPS': Caps
    '&kp DEL': Del
    '&kp ESC': Esc
    '&kp TAB': Tab
    '&kp BSPC': Bspc
